<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduGest PME{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-link { transition: all 0.2s ease; }
        .sidebar-link:hover { background-color: rgba(255,255,255,0.15); }
        .sidebar-link.active { background-color: rgba(255,255,255,0.2); border-left: 3px solid white; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-indigo-600 text-white flex flex-col flex-shrink-0">
            <div class="p-6 flex items-center gap-3 border-b border-indigo-500">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-indigo-600 font-bold text-xl">E</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">EduGest PME</h1>
                    <p class="text-xs text-indigo-200">Admin System</p>
                </div>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                <a href="/dashboard/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-th-large w-5 text-center"></i> Dashboard
                </a>
                <a href="/ingesta/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-file-upload w-5 text-center"></i> Ingesta de Datos
                </a>
                <a href="/acciones/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-tasks w-5 text-center"></i> Acciones
                </a>
                <a href="/reportes/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-chart-bar w-5 text-center"></i> Reportes
                </a>
                <a href="/configuracion/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-cog w-5 text-center"></i> Configuración
                </a>
            </nav>
            <div class="p-4 border-t border-indigo-500">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-400 rounded-full flex items-center justify-center text-xs font-bold">AD</div>
                    <div class="text-sm">
                        <p class="font-medium">Usuario Admin</p>
                        <p class="text-xs text-indigo-200">Director</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-gray-50">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
